<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlycoGarden Control Room · Fudan iGEM 2026</title>
  <link rel="stylesheet" href="style.css" />
  <script src="./vendor/vue.global.js"></script>
  <script src="./vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>GlycoGarden Control Room</h1>
      <p>Interactive platform for N-linked glycosylation result prediction</p>
    </header>

    <main class="app-main">
      <div v-if="loadingConfig" class="status">Loading simulator configuration…</div>
      <div v-else-if="!config" class="status error" role="alert">{{ error }}</div>

      <template v-else>
        <section class="controls" aria-label="Simulation controls">
          <section class="control-group physiology-group" aria-labelledby="physiology-heading">
            <div class="physiology-heading-row">
              <div>
                <h2 id="physiology-heading">Cell physiology parameters</h2>
                <p>These parameters control the total glycan influx and the reaction conditions in every cisterna.</p>
              </div>
            </div>

            <div class="param-grid">
              <article class="param-card">
                <header class="param-card-header">
                  <h3>Residence time (τ)</h3>
                  <span class="param-unit">min</span>
                </header>
                <div class="param-body">
                  <input
                    type="range"
                    class="param-slider"
                    :min="config.tauBounds[0]"
                    :max="config.tauBounds[1]"
                    step="0.01"
                    v-model.number="params.tau"
                    :aria-label="`Residence time per cisterna in minutes`"
                  />
                  <div class="number-wrap">
                    <input
                      type="number"
                      :min="config.tauBounds[0]"
                      :max="config.tauBounds[1]"
                      step="0.01"
                      inputmode="decimal"
                      v-model.number="params.tau"
                      aria-label="Residence time per cisterna"
                    />
                    <span aria-hidden="true">min</span>
                  </div>
                </div>
              </article>

              <article class="param-card">
                <header class="param-card-header">
                  <h3>Cisterna volume (V)</h3>
                  <span class="param-unit">µL</span>
                </header>
                <div class="param-body">
                  <input
                    type="range"
                    class="param-slider"
                    :min="config.compartmentVolumeBounds[0]"
                    :max="config.compartmentVolumeBounds[1]"
                    step="0.01"
                    v-model.number="params.compartmentVolume"
                    aria-label="Single cisterna volume in microliters"
                  />
                  <div class="number-wrap">
                    <input
                      type="number"
                      :min="config.compartmentVolumeBounds[0]"
                      :max="config.compartmentVolumeBounds[1]"
                      step="0.01"
                      inputmode="decimal"
                      v-model.number="params.compartmentVolume"
                      aria-label="Single cisterna volume"
                    />
                    <span aria-hidden="true">µL</span>
                  </div>
                </div>
              </article>

              <article class="param-card">
                <header class="param-card-header">
                  <h3>Protein production rate (q)</h3>
                  <span class="param-unit">µM/min</span>
                </header>
                <div class="param-body">
                  <input
                    type="range"
                    class="param-slider"
                    :min="config.proteinProdRateBounds[0]"
                    :max="config.proteinProdRateBounds[1]"
                    step="1"
                    v-model.number="params.proteinProdRate"
                    aria-label="Protein production rate in uM per minute"
                  />
                  <div class="number-wrap">
                    <input
                      type="number"
                      :min="config.proteinProdRateBounds[0]"
                      :max="config.proteinProdRateBounds[1]"
                      step="1"
                      inputmode="decimal"
                      v-model.number="params.proteinProdRate"
                      aria-label="Protein production rate"
                    />
                    <span aria-hidden="true">µM/min</span>
                  </div>
                </div>
              </article>

              <article class="param-card computed-card">
                <header class="param-card-header">
                  <h3>Total glycan concentration</h3>
                  <span class="param-unit">µM</span>
                </header>
                <div class="computed-value" aria-live="polite">
                  {{ formatConcentration(totGlycanConc) }}
                </div>
                <p class="computed-formula">= q · τ / V</p>
              </article>
            </div>
          </section>

          <section class="control-group donor-group" aria-labelledby="donor-heading">
            <div class="donor-heading-row">
              <div>
                <h2 id="donor-heading">Donor concentrations</h2>
                <p>Intra-Golgi nucleotide sugar levels that drive the transferase reactions.</p>
              </div>
            </div>
            <div class="donor-grid">
              <article v-for="name in config.donorNames" :key="name" class="donor-card">
                <label :for="`donor-${name}`">{{ name }}</label>
                <div class="number-wrap">
                  <input
                    :id="`donor-${name}`"
                    type="number"
                    :min="config.donorBounds[name][0]"
                    :max="config.donorBounds[name][1]"
                    step="1"
                    inputmode="decimal"
                    v-model.number="params.donorConcs[name]"
                    :aria-label="`${name} concentration in micromolar`"
                  />
                  <span aria-hidden="true">µM</span>
                </div>
              </article>
            </div>
            <button type="button" class="reset-btn" @click="resetAll">Reset all to baseline</button>
          </section>

          <section class="control-group distribution-group" aria-labelledby="distribution-heading">
            <div class="distribution-heading-row">
              <div>
                <h2 id="distribution-heading">Enzyme compartment distribution</h2>
                <p>
                  Edit one compartment and the unlocked remainder is redistributed proportionally.
                  Each row always totals 100%.
                </p>
              </div>
              <div class="compartment-legend" aria-label="Compartment colors">
                <span v-for="compartment in config.compartments" :key="compartment" :class="`legend-${compartment.toLowerCase()}`">
                  {{ compartment }}
                </span>
              </div>
            </div>

            <p class="group-note">
              These ten controls represent base enzyme groups. Branch-specific GalT, SiaT, and GnT reaction aliases share their base group's localization profile.
            </p>

            <p v-if="inputError" class="inline-message error" role="alert">{{ inputError }}</p>

            <article v-for="name in config.enzymeNames" :key="name" class="enzyme-card">
              <div class="enzyme-card-header">
                <h3>{{ name }}</h3>
                <span class="total-badge">Total {{ profileTotal(name) }}</span>
                <button type="button" class="enzyme-reset" @click="resetEnzyme(name)">Reset</button>
              </div>

              <div class="compartment-inputs">
                <div v-for="compartment in config.compartments" :key="compartment" class="compartment-input">
                  <label :for="`dist-${name}-${compartment}`">
                    <span :class="`color-dot dot-${compartment.toLowerCase()}`"></span>
                    {{ compartment }}
                  </label>
                  <div class="number-wrap">
                    <input
                      :id="`dist-${name}-${compartment}`"
                      type="number"
                      min="0"
                      max="100"
                      step="0.01"
                      inputmode="decimal"
                      :value="displayPercentage(name, compartment)"
                      :aria-label="`${name} ${compartment} percentage`"
                      @change="commitCompartment(name, compartment, $event)"
                      @keydown.enter="$event.target.blur()"
                    />
                    <span aria-hidden="true">%</span>
                  </div>
                  <button
                    type="button"
                    class="lock-btn"
                    :class="{ locked: distributionLocks[name][compartment] }"
                    :aria-pressed="distributionLocks[name][compartment]"
                    :aria-label="`${distributionLocks[name][compartment] ? 'Unlock' : 'Lock'} ${name} ${compartment}`"
                    @click="toggleLock(name, compartment)"
                  >{{ distributionLocks[name][compartment] ? 'Locked' : 'Lock' }}</button>
                </div>
              </div>

              <div class="distribution-bar" :aria-label="`${name} compartment distribution`">
                <span
                  v-for="compartment in config.compartments"
                  :key="compartment"
                  :style="segmentStyle(name, compartment)"
                  :title="`${compartment}: ${displayPercentage(name, compartment)}%`"
                ></span>
              </div>
            </article>
          </section>

          <div v-if="resultStale" class="inline-message stale" role="status">
            Controls changed after the last run. Run the simulation again to refresh the result.
          </div>
          <div v-if="cancelledMessage" class="inline-message stale" role="status">{{ cancelledMessage }}</div>
          <div v-if="error" class="inline-message error" role="alert">{{ error }}</div>

          <div class="control-group">
            <button
              type="button"
              class="run-btn"
              :disabled="computing"
              @click="runSimulation"
            >
              {{ computing ? 'Computing steady-state model…' : (resultStale ? 'Run updated simulation' : 'Run simulation') }}
            </button>
            <button
              v-if="computing"
              type="button"
              class="cancel-btn"
              @click="cancelSimulation"
            >Stop waiting</button>
            <p class="compute-hint">
              Custom distributions may take up to two minutes.
              Duplicate submissions are disabled while a run is active; identical completed runs are cached.
            </p>
          </div>
        </section>

        <section v-if="computing" class="status" role="status">
          Running the glycosylation model. You can continue reviewing the controls while it computes.
        </section>

        <section v-if="result && !computing" class="results" :class="{ 'results-stale': resultStale }">
          <div class="chart-section">
            <h2>Top predicted glycoforms</h2>
            <div ref="chartRef" class="chart"></div>
          </div>

          <div class="table-section">
            <table>
              <thead>
                <tr><th>Rank</th><th>ID</th><th>Glycoform</th><th>Relative abundance</th></tr>
              </thead>
              <tbody>
                <tr v-for="row in chartRows" :key="row.id">
                  <td>{{ row.rank }}</td>
                  <td>#{{ row.id }}</td>
                  <td>{{ row.label }}</td>
                  <td>{{ formatPercent(row.value) }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </template>
    </main>

    <footer class="app-footer">
      <p>Fudan iGEM 2026 · GlycoGarden · <a href="https://gitlab.igem.org/2026/software/fudan/glycogarden">GitLab</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
